<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F7A5A" />
    <meta name="description" content="Organize sua vida financeira com clareza, simplicidade e controle." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meu Financeiro" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Meu Financeiro — Organize. Planeje. Realize.</title>
    <style>
      /* Mensagem de emergência: visível se o JavaScript não executar.
         O React substitui todo este conteúdo ao montar. */
      body { margin: 0; background: #F1F5F9; }
      #boot {
        max-width: 420px;
        margin: 14vh auto;
        padding: 28px 24px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0F172A;
        text-align: center;
      }
      #boot img { width: 64px; height: 64px; border-radius: 14px; }
      #boot h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 18px 0 8px; }
      #boot p { margin: 0; color: #64748B; font-size: 14px; line-height: 20px; }
      #boot code {
        display: block; margin-top: 16px; padding: 12px 14px;
        background: #FDECEC; border-radius: 12px;
        color: #B91C1C; font-size: 12px;
        text-align: left; word-break: break-word; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="./icon-192.png" alt="" />
        <h1>Carregando o Meu Financeiro…</h1>
        <p>
          Se esta mensagem permanecer, o navegador não conseguiu executar a aplicação.
          O motivo aparecerá abaixo assim que for detectado.
        </p>
        <code id="boot-error" style="display:none"></code>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        var box = document.getElementById('boot-error')
        if (!box) return
        box.style.display = 'block'
        box.textContent = (e.message || 'erro desconhecido') +
          (e.filename ? '\n' + e.filename + ':' + e.lineno : '')
      }, true)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
