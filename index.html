<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a24" />
    <meta name="description" content="Painel financeiro pessoal privado: caixa, cartões, investimentos por objetivo e previsão de saldo." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meu Financeiro" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317604A'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='white' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Meu Financeiro</title>
    <style>
      /* Mensagem de emergência: fica visível se o JavaScript não rodar.
         O React apaga tudo isto assim que monta a aplicação. */
      #boot {
        max-width: 460px;
        margin: 12vh auto;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #14202b;
        line-height: 1.5;
      }
      #boot h1 { font-size: 19px; margin: 0 0 8px; }
      #boot p { margin: 0 0 10px; color: #667685; font-size: 14px; }
      #boot code {
        display: block;
        margin-top: 12px;
        padding: 10px 12px;
        background: #fbeceb;
        border-radius: 10px;
        color: #a83232;
        font-size: 12px;
        word-break: break-word;
        white-space: pre-wrap;
      }
      body { margin: 0; background: #eff2ef; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <h1>Carregando o Meu Financeiro…</h1>
        <p>
          Se esta mensagem continuar na tela por mais de alguns segundos, o navegador
          não conseguiu executar a aplicação. O motivo aparece na caixa abaixo assim
          que for detectado.
        </p>
        <code id="boot-error" style="display:none"></code>
      </div>
    </div>
    <script>
      // Captura falhas de carregamento ou de sintaxe, que acontecem
      // antes de qualquer código do aplicativo rodar.
      window.addEventListener('error', function (e) {
        var box = document.getElementById('boot-error')
        if (!box) return
        box.style.display = 'block'
        box.textContent = (e.message || 'erro desconhecido') +
          (e.filename ? '\n' + e.filename + ':' + e.lineno : '')
      }, true)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
