<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#101a24" />

    <meta
      name="description"
      content="Meu Financeiro — controle de caixa, cartões, investimentos, imóveis e planejamento financeiro."
    />

    <meta name="robots" content="noindex, nofollow" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Meu Financeiro" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317604A'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='27' font-weight='700' fill='white' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Meu Financeiro</title>

    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #eff2ef;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #boot {
        box-sizing: border-box;
        width: min(460px, calc(100% - 32px));
        margin: 12vh auto;
        padding: 24px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 40px rgba(16, 26, 36, 0.08);
        color: #14202b;
        line-height: 1.5;
      }

      #boot h1 {
        margin: 0 0 8px;
        font-size: 19px;
      }

      #boot p {
        margin: 0;
        color: #667685;
        font-size: 14px;
      }

      #boot-error {
        display: none;
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        background: #fbeceb;
        color: #a83232;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot">
        <h1>Carregando o Meu Financeiro…</h1>
        <p>
          Inicializando sua sessão e seus dados financeiros.
        </p>
        <code id="boot-error"></code>
      </div>
    </div>

    <script>
      (function () {
        function showBootError(message) {
          var box = document.getElementById("boot-error");

          if (!box) return;

          box.style.display = "block";
          box.textContent =
            message || "Não foi possível iniciar a aplicação.";
        }

        window.addEventListener(
          "error",
          function (event) {
            if (event && event.message) {
              showBootError(
                event.message +
                  (event.filename
                    ? "\n" +
                      event.filename +
                      ":" +
                      event.lineno +
                      ":" +
                      event.colno
                    : "")
              );
            }
          },
          true
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;

          showBootError(
            reason && reason.message
              ? reason.message
              : String(reason || "Erro inesperado na aplicação.")
          );
        });
      })();
    </script>

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
